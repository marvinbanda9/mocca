<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>QR Restaurant Pro</title>

<style>
/* RESET */
body {
  margin:0;
  font-family: Arial;
  overflow-x:hidden;
}

/* 🎥 VIDEO BACKGROUND */
#bgVideo {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* DARK OVERLAY */
.overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}

/* HEADER */
header {
  background:rgba(192,57,43,0.9);
  color:white;
  text-align:center;
  padding:12px;
  position:sticky;
  top:0;
  z-index:10;
}

/* NOTIFICATION */
.banner {
  display:none;
  background:#2ecc71;
  color:white;
  text-align:center;
  padding:10px;
  position:sticky;
  top:48px;
  z-index:10;
}

/* NAV */
nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
}

nav button {
  flex:1;
  padding:12px;
  color:white;
  background:none;
  border:none;
  font-size:12px;
}

/* PAGES */
.page {
  display:none;
  padding:12px;
  padding-bottom:90px;
}
.active { display:block; }

/* GLASS CARDS */
.box, .food, .cart {
  background:rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-radius:14px;
}

/* FOOD */
.food {
  display:flex;
  gap:10px;
  padding:10px;
  margin-bottom:10px;
  align-items:center;
}

.food img {
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
}

/* BUTTONS */
button {
  border:none;
  border-radius:8px;
  padding:8px 10px;
}

.add { background:#27ae60; color:white; }

.primary {
  background:#2980b9;
  color:white;
  width:100%;
  padding:12px;
  font-size:16px;
}

/* INPUTS */
input, select, textarea {
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* CART */
.cart {
  padding:10px;
  margin-top:10px;
}

/* STAR */
.stars span {
  font-size:22px;
  cursor:pointer;
  color:#f1c40f;
}

<!-- ADD THIS CSS inside your <style> -->

/* CLICKABLE FOOD IMAGE */
.food img{
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
  cursor:pointer;
  transition:0.3s;
}

.food img:hover{
  transform:scale(1.06);
}

/* IMAGE POPUP */
#imgPopup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#imgPopup img{
  max-width:92%;
  max-height:85%;
  border-radius:16px;
  box-shadow:0 0 25px rgba(255,255,255,0.25);
}

#imgPopup span{
  position:absolute;
  top:15px;
  right:20px;
  color:white;
  font-size:35px;
  cursor:pointer;
  font-weight:bold;
}

<!-- ADD this CSS inside your <style> -->

#imgPopup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.88);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#imgPopup img{
  max-width:92%;
  max-height:84%;
  border-radius:16px;
  box-shadow:0 0 25px rgba(255,255,255,0.25);
}

.closePop{
  position:absolute;
  top:12px;
  right:18px;
  color:#fff;
  font-size:38px;
  cursor:pointer;
  z-index:3;
}

/* PREV / NEXT BUTTONS */
.navBtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,0.18);
  color:#fff;
  font-size:34px;
  cursor:pointer;
  backdrop-filter:blur(5px);
  z-index:2;
}

.prevBtn{
  left:12px;
}

.nextBtn{
  right:12px;
}

.navBtn:hover{
  background:rgba(255,255,255,0.30);
}

</style>
</head>

<body>

<!-- 🎥 BACKGROUND VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="https://cdn.coverr.co/videos/coverr-a-busy-restaurant-kitchen-8576/1080p.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<header>
<h3>🍽️ QR Restaurant Pro</h3>
<small id="tableLabel"></small>
</header>

<div id="banner" class="banner"></div>

<!-- MENU -->
<div id="menu" class="page active">

<h3 style="color:white;">🍔 Menu</h3>

<select id="category" onchange="renderMenu()">
  <option value="all">All</option>
  <option value="breakfast">🍳 Breakfast</option>
  <option value="lunch">🍽️ Lunch</option>
  <option value="local">🥘 Local</option>
  <option value="drinks">🥤 Drinks</option>
</select>

<div id="menuBox"></div>

<div class="cart">
<h4>🛒 Cart</h4>
<div id="cartBox">Empty</div>
<h4>Total: $<span id="total">0</span></h4>
<button class="primary" onclick="placeOrder()">Place Order</button>
</div>

</div>

<!-- RESERVATION -->
<div id="reserve" class="page">

<h3 style="color:white;">🪑 Reservations</h3>

<div class="box">
<input id="rname" placeholder="Name">
<input type="date" id="rdate">
<input type="time" id="rtime">
<input type="number" id="rguests" placeholder="Guests">

<button class="primary" onclick="bookTable()">Book Table</button>
</div>

<div id="resBox"></div>

</div>

<!-- HISTORY -->
<div id="history" class="page">
<h3 style="color:white;">📜 History</h3>

<div class="box">
Spent: $<span id="spent">0</span><br>
Vouchers: <span id="vouchers">0</span>
</div>

<div id="historyBox"></div>
</div>

<!-- FEEDBACK -->
<div id="feedback" class="page">

<h3 style="color:white;">⭐ Feedback & Tips</h3>

<div class="box">
<textarea id="comment" placeholder="Your feedback..."></textarea>
<input id="tip" type="number" placeholder="Tip amount ($)">
<button class="primary" onclick="sendFeedback()">Send</button>
</div>

<div id="fbBox"></div>

</div>

<!-- NAV -->
<nav>
<button onclick="show('menu')">Menu</button>
<button onclick="show('reserve')">Reserve</button>
<button onclick="show('history')">History</button>
<button onclick="show('feedback')">Feedback</button>
</nav>
<script>
/* ADD these variables near top of script */

let currentImageIndex = 0;
let cart = [];
let total = 0;

const table = new URLSearchParams(window.location.search).get("table") || "0";
document.getElementById("tableLabel").innerText = "Table " + table;

/* MENU WITH WORKING IMAGE URLS */
const menu = [
 {
   n:"Egg Sandwich",
   p:3,
   c:"breakfast",
   i:"https://images.unsplash.com/photo-1482049016688-2d3e1b311543?w=200"
 },
 {
   n:"Burger",
   p:5,
   c:"lunch",
   i:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200"
 },
 {
   n:"Pizza",
   p:6,
   c:"lunch",
   i:"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=200"
 },
 {
   n:"Matoke",
   p:4,
   c:"local",
   i:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=200"
 },
 {
   n:"Soda",
   p:1,
   c:"drinks",
   i:"https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=200"
 }
];

/* NOTIFY */
function notify(t){
 let b = document.getElementById("banner");
 b.innerText = t;
 b.style.display = "block";
 setTimeout(() => {
   b.style.display = "none";
 }, 2000);
}

/* NAVIGATION */
function show(p){
 document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
 document.getElementById(p).classList.add("active");
 loadAll();
}




/* REPLACE ONLY renderMenu() WITH THIS */

function renderMenu(){

 let c = document.getElementById("category").value;

 let filtered = menu.filter(x => c === "all" || x.c === c);

 document.getElementById("menuBox").innerHTML =
 filtered.map(x => `
   <div class="food">

     <img 
       src="${x.i}" 
       alt="${x.n}"
       onclick="openImage('${x.i}')"
       onerror="this.src='https://via.placeholder.com/80?text=Food'"
     >

     <div style="flex:1">
       <b>${x.n}</b><br>
       $${x.p}
     </div>

     <button class="add" onclick="add('${x.n}',${x.p})">+</button>

   </div>
 `).join("");

}

/* ADD these functions inside script */

function prevImage(){

 currentImageIndex--;

 if(currentImageIndex < 0){
   currentImageIndex = menu.length - 1;
 }

 document.getElementById("bigImg").src = menu[currentImageIndex].i;
}

function nextImage(){

 currentImageIndex++;

 if(currentImageIndex >= menu.length){
   currentImageIndex = 0;
 }

 document.getElementById("bigImg").src = menu[currentImageIndex].i;
}

function closeImage(){
 document.getElementById("imgPopup").style.display = "none";
}

/* REPLACE openImage() with this */

function openImage(src){

 currentImageIndex = menu.findIndex(x => x.i === src);

 if(currentImageIndex < 0) currentImageIndex = 0;

 document.getElementById("bigImg").src = menu[currentImageIndex].i;
 document.getElementById("imgPopup").style.display = "flex";
}
function closeImage(){
 document.getElementById("imgPopup").style.display = "none";
}








/* CART */
function add(n,p){
 cart.push({n,p});
 total += p;
 updateCart();
 notify(n + " added");
}

function updateCart(){
 document.getElementById("cartBox").innerHTML =
 cart.length
 ? cart.map(x => x.n).join("<br>")
 : "Empty";

 document.getElementById("total").innerText = total.toFixed(2);
}

/* PLACE ORDER */
function placeOrder(){

 if(cart.length === 0){
   notify("Cart is empty");
   return;
 }

 let h = JSON.parse(localStorage.getItem("history") || "[]");

 h.push({
   table,
   items: cart,
   total,
   time: new Date().toLocaleTimeString()
 });

 localStorage.setItem("history", JSON.stringify(h));

 cart = [];
 total = 0;
 updateCart();

 notify("Order placed ✔");
}

/* BOOK TABLE */
function bookTable(){

 let r = JSON.parse(localStorage.getItem("reservations") || "[]");

 r.push({
   name: document.getElementById("rname").value,
   date: document.getElementById("rdate").value,
   time: document.getElementById("rtime").value,
   guests: document.getElementById("rguests").value,
   id: Date.now()
 });

 localStorage.setItem("reservations", JSON.stringify(r));

 notify("Table booked ✔");
 loadReservations();
}

/* LOAD BOOKINGS */
function loadReservations(){

 let r = JSON.parse(localStorage.getItem("reservations") || "[]");

 document.getElementById("resBox").innerHTML =
 r.map(x => `
   <div class="box">
     ${x.name}<br>
     ${x.date} ${x.time}<br>
     Guests: ${x.guests}
   </div>
 `).join("");
}

/* HISTORY */
function loadHistory(){

 let h = JSON.parse(localStorage.getItem("history") || "[]");

 let spent = h.reduce((s,x) => s + x.total, 0);

 document.getElementById("spent").innerText = spent.toFixed(2);
 document.getElementById("vouchers").innerText = Math.floor(spent / 20);

 document.getElementById("historyBox").innerHTML =
 h.map(x => `
   <div class="box">
     Table ${x.table}<br>
     ${x.items.map(i => i.n).join(", ")}<br>
     $${x.total}
   </div>
 `).join("");
}

/* FEEDBACK */
function sendFeedback(){

 let f = JSON.parse(localStorage.getItem("feedback") || "[]");

 f.push({
   table,
   comment: document.getElementById("comment").value,
   tip: document.getElementById("tip").value || 0,
   time: new Date().toLocaleTimeString()
 });

 localStorage.setItem("feedback", JSON.stringify(f));

 document.getElementById("comment").value = "";
 document.getElementById("tip").value = "";

 notify("Thanks ❤️");
}

/* LOAD ALL */
function loadAll(){
 renderMenu();
 loadHistory();
 loadReservations();
}

/* START */
loadAll();
updateCart();
setInterval(loadAll, 3000);

</script>

<!-- ADD THIS just before </body> -->

<!-- REPLACE your popup HTML with this -->

<!-- REPLACE popup HTML with this -->

<div id="imgPopup">

  <span class="closePop" onclick="closeImage()">&times;</span>

  <button class="navBtn prevBtn" onclick="prevImage()">❮</button>

  <img id="bigImg">

  <div id="imgPrice"></div>

  <button class="navBtn nextBtn" onclick="nextImage()">❯</button>

</div>
</body>
</html>
